<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Adventure Island Drag and Drop!</title>
    <style>
      :root {
        --ocean-deep: #0e6e6e;
        --ocean: #1e97a0;
        --ocean-light: #54c7c9;
        --coral: #ff7b54;
        --sun: #ffd23f;
        --ink: #0b3d3a;
        --white: #fffdf8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: linear-gradient(180deg, #f4b23e 0%, #e47d31 60%);
        font-family: "Trebuchet MS", "Verdana", sans-serif;
        color: var(--ink);
        overscroll-behavior: none;
      }
      .sun {
        position: absolute;
        top: max(10px, env(safe-area-inset-top, 10px));
        right: clamp(10px, 4vw, 40px);
        width: clamp(40px, 8vw, 72px);
        height: clamp(40px, 8vw, 72px);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffefae, var(--sun) 70%);
        box-shadow: 0 0 24px 8px rgba(255, 210, 63, 0.5);
        pointer-events: none;
      }
      .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.82);
        border-radius: 50px;
        pointer-events: none;
      }
      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
      }
      .cloud1 {
        top: 5%;
        left: 5%;
        width: 80px;
        height: 26px;
      }
      .cloud1::before {
        width: 40px;
        height: 40px;
        top: -18px;
        left: 8px;
      }
      .cloud1::after {
        width: 30px;
        height: 30px;
        top: -12px;
        left: 42px;
      }
      .cloud2 {
        top: 12%;
        left: 55%;
        width: 60px;
        height: 20px;
        opacity: 0.75;
      }
      .cloud2::before {
        width: 30px;
        height: 30px;
        top: -14px;
        left: 6px;
      }
      .cloud2::after {
        width: 22px;
        height: 22px;
        top: -8px;
        left: 32px;
      }
      .wrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        padding: max(6px, env(safe-area-inset-top, 6px))
          max(10px, env(safe-area-inset-right, 10px))
          max(8px, env(safe-area-inset-bottom, 8px))
          max(10px, env(safe-area-inset-left, 10px));
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 4px 0 6px;
        gap: clamp(6px, 2vw, 14px);
      }
      h1 {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-size: clamp(16px, 5.5vw, 50px);
        color: var(--sun);
        -webkit-text-stroke: 1.5px var(--ocean-deep);
        white-space: nowrap;
      }
      .reset-btn {
        background: var(--coral);
        color: var(--white);
        border: none;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: clamp(10px, 2vw, 14px);
        white-space: nowrap;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 3px 0 #c2522f;
        font-family: inherit;
        flex-shrink: 0;
        text-decoration: none;
      }
      .reset-btn:active {
        transform: translateY(2px);
        box-shadow: none;
      }
      .zone {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: clamp(5px, 1.5vw, 12px);
        min-height: 0;
      }
      .targets {
        flex: 1.5;
      }
      .bank {
        flex: 1;
        margin-top: clamp(8px, 2vh, 18px);
        padding: clamp(6px, 1.5vw, 12px);
        background: rgba(255, 255, 255, 0.28);
        border: 2.5px dashed var(--sun);
        border-radius: 18px;
      }
      .slot {
        position: relative;
        background: var(--white);
        border: 2.5px solid var(--sun);
        border-radius: clamp(8px, 2vw, 14px);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6% 6% 7%;
        gap: 4px;
        min-height: 0;
        overflow: visible;
      }
      .slot img {
        flex: 1;
        min-height: 0;
        max-width: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .slot .label {
        flex-shrink: 0;
        min-height: clamp(28px, 8vw, 48px);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        border-top: 2px dashed var(--sun);
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        font-size: clamp(12px, 4.5vw, 34px);
        color: var(--ocean-deep);
        text-align: center;
        line-height: 1;
      }
      .slot.done {
        background: linear-gradient(135deg, #fffbea, #fff1c4);
        animation: glow 1s ease-in-out infinite alternate;
      }
      .slot.done .label {
        border-top-color: transparent;
      }
      @keyframes glow {
        from {
          box-shadow:
            0 0 6px 0 rgba(255, 210, 63, 0.6),
            0 3px 0 rgba(0, 0, 0, 0.1);
        }
        to {
          box-shadow:
            0 0 16px 6px rgba(255, 210, 63, 0.85),
            0 3px 0 rgba(0, 0, 0, 0.1);
        }
      }
      .slot.over {
        transform: scale(1.05);
        border-color: orange;
      }
      .slot.wrong {
        animation: shake 0.4s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
      .cell {
        position: relative;
        min-height: 0;
      }
      .chip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        background: repeating-linear-gradient(
          135deg,
          var(--ocean) 0,
          var(--ocean) 10px,
          var(--ocean-light) 10px,
          var(--ocean-light) 20px
        );
        border: 2.5px solid var(--white);
        border-radius: clamp(8px, 2vw, 14px);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.14);
        color: var(--white);
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        font-size: clamp(13px, 5vw, 38px);
        -webkit-text-stroke: 1px var(--ocean-deep);
      }
      .chip.drag {
        z-index: 40;
        cursor: grabbing;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.3);
        transform-origin: center;
      }
      .chip.back {
        transition: transform 0.25s ease;
      }
      .chip.used {
        visibility: hidden;
      }
      .sparkle {
        position: absolute;
        font-size: 16px;
        pointer-events: none;
        animation: pop 0.9s ease-out forwards;
        z-index: 5;
      }
      @keyframes pop {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(0.6) rotate(0);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(180deg);
        }
      }
      .rotate-msg {
        display: none;
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #f4b23e 0%, #e47d31 60%);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        z-index: 100;
      }
      .rotate-msg p {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-size: clamp(18px, 4vw, 28px);
        color: var(--white);
        -webkit-text-stroke: 1px var(--ocean-deep);
        text-align: center;
        padding: 0 20px;
      }
      @media (orientation: landscape) and (max-width: 926px) {
        .wrap,
        .overlay {
          display: none;
        }
        .rotate-msg {
          display: flex;
        }
      }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(11, 61, 58, 0.72);
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 20px;
      }
      .overlay.show {
        display: flex;
      }
      .win-card {
        background: var(--white);
        border-radius: 24px;
        padding: clamp(20px, 5vw, 36px);
        text-align: center;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.15);
        border: 4px solid var(--sun);
      }
      .win-card h2 {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        color: var(--coral);
        -webkit-text-stroke: 1px var(--ocean-deep);
        font-size: clamp(22px, 5.5vw, 30px);
        margin: 0 0 8px;
      }
      .win-card p {
        font-weight: bold;
        color: var(--ocean-deep);
        margin-bottom: 16px;
      }
      .win-emojis {
        font-size: 32px;
        margin-bottom: 8px;
      }
      .chip,
      .chip span,
      .slot .label,
      .slot .label span {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="rotate-msg">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="wrap">
      <div class="header">
        <a class="reset-btn" href="index.html">⬅️ Back</a>
        <h1>Unit 6</h1>
        <button class="reset-btn" id="resetBtn">Play Again 🦜</button>
      </div>
      <div class="zone targets" id="targets"></div>
      <div class="zone bank" id="bank"></div>
    </div>
    <div class="overlay" id="overlay">
      <div class="win-card">
        <div class="win-emojis">🏆 Great! 🏆</div>
        <h2>You found all the treasure!</h2>
        <p id="winStats">Adventure Island</p>
        <button class="reset-btn" id="playAgainBtn">Play Again 🌴</button>
      </div>
    </div>
    <div class="overlay show" id="startOverlay">
      <div class="win-card">
        <div class="win-emojis">🌴 Drag and Drop 🌴</div>
        <h2>Ready?</h2>
        <p>Drag each word to its picture!</p>
        <button class="reset-btn" id="startBtn">Start 🌴</button>
      </div>
    </div>
    <script>
      const PAIRS = [
        { img: "../images/ball.png", word: "ball" },
        { img: "../images/card.png", word: "card" },
        { img: "../images/kite.png", word: "kite" },
        { img: "../images/bat.png", word: "bat" },
        { img: "../images/game.png", word: "game" },
        { img: "../images/balloon.png", word: "balloon" },
        { img: "../images/dinosaur.png", word: "dinosaur" },
        { img: "../images/doll.png", word: "doll" },
      ];

      /* audio */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state !== "running") audioCtx.resume();
        return audioCtx;
      }
      /* iOS unlock: must happen inside touchend/click */
      let unlocked = false;
      function unlockAudio(e) {
        if (unlocked) return;
        if (e && (e.type === "touchstart" || e.type === "pointerdown")) {
          try {
            getCtx();
          } catch (x) {}
          return;
        }
        unlocked = true;
        try {
          const c = getCtx(),
            b = c.createBuffer(1, 1, 22050),
            src = c.createBufferSource();
          src.buffer = b;
          src.connect(c.destination);
          src.start(0);
        } catch (x) {}
        try {
          if ("speechSynthesis" in window) {
            const u = new SpeechSynthesisUtterance(" ");
            u.volume = 0;
            speechSynthesis.speak(u);
          }
        } catch (x) {}
      }
      ["touchstart", "touchend", "pointerdown", "click"].forEach((ev) =>
        document.addEventListener(ev, unlockAudio, { passive: true }),
      );
      function playTone(freq, t, dur, peak) {
        const ctx = getCtx(),
          o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = "triangle";
        o.frequency.value = freq;
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t);
        o.stop(t + dur + 0.02);
      }
      function playMatchJingle() {
        const n = getCtx().currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, n + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const n = getCtx().currentTime;
        playTone(220, n, 0.18, 0.12);
        playTone(196, n + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const n = getCtx().currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, n + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }
      function speak(word) {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = "en-US";
        u.rate = 0.85;
        const v = speechSynthesis
          .getVoices()
          .find((x) => x.lang && x.lang.replace("_", "-").startsWith("en-US"));
        if (v) u.voice = v;
        setTimeout(() => speechSynthesis.speak(u), 60);
      }

      /* state */
      let matches = 0,
        tries = 0;

      function shuffle(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function render() {
        const targets = document.getElementById("targets");
        const bank = document.getElementById("bank");
        targets.innerHTML = "";
        bank.innerHTML = "";
        shuffle(PAIRS.map((p, i) => i)).forEach((i) => {
          const s = document.createElement("div");
          s.className = "slot";
          s.dataset.pair = i;
          s.innerHTML =
            '<img alt="" src="' + PAIRS[i].img + '"><div class="label"></div>';
          targets.appendChild(s);
        });
        shuffle(PAIRS.map((p, i) => i)).forEach((i) => {
          const cell = document.createElement("div");
          cell.className = "cell";
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.dataset.pair = i;
          chip.textContent = PAIRS[i].word;
          attachDrag(chip);
          cell.appendChild(chip);
          bank.appendChild(cell);
        });
      }

      function slotAt(x, y) {
        const els = document.elementsFromPoint(x, y);
        for (const el of els) {
          const s = el.closest && el.closest(".slot");
          if (s) return s;
        }
        return null;
      }

      function attachDrag(chip) {
        let sx = 0,
          sy = 0,
          active = false,
          lastOver = null;
        chip.addEventListener("pointerdown", (e) => {
          if (active) return;
          getCtx();
          active = true;
          sx = e.clientX;
          sy = e.clientY;
          chip.setPointerCapture(e.pointerId);
          chip.classList.remove("back");
          chip.classList.add("drag");
        });
        chip.addEventListener("pointermove", (e) => {
          if (!active) return;
          chip.style.transform =
            "translate(" +
            (e.clientX - sx) +
            "px," +
            (e.clientY - sy) +
            "px) scale(1.08)";
          const s = slotAt(e.clientX, e.clientY);
          if (lastOver && lastOver !== s) lastOver.classList.remove("over");
          if (s && !s.classList.contains("done")) s.classList.add("over");
          lastOver = s;
        });
        const finish = (e, cancelled) => {
          if (!active) return;
          active = false;
          if (lastOver) lastOver.classList.remove("over");
          lastOver = null;
          chip.classList.remove("drag");
          const s = cancelled ? null : slotAt(e.clientX, e.clientY);
          if (s && !s.classList.contains("done")) {
            tries++;
            if (s.dataset.pair === chip.dataset.pair) {
              s.classList.add("done");
              s.querySelector(".label").textContent =
                PAIRS[+chip.dataset.pair].word;
              chip.style.transform = "";
              chip.classList.add("used");
              spawnSparkles(s);
              playMatchJingle();
              speak(PAIRS[+chip.dataset.pair].word);
              matches++;
              if (matches === PAIRS.length) setTimeout(showWin, 900);
              return;
            }
            s.classList.add("wrong");
            playWrongSound();
            setTimeout(() => s.classList.remove("wrong"), 420);
          }
          chip.classList.add("back");
          chip.style.transform = "";
        };
        chip.addEventListener("pointerup", (e) => finish(e, false));
        chip.addEventListener("pointercancel", (e) => finish(e, true));
      }

      function spawnSparkles(el) {
        const emojis = ["✨", "🌟", "🐚", "⭐"];
        for (let i = 0; i < 5; i++) {
          const s = document.createElement("div");
          s.className = "sparkle";
          s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          const a = Math.random() * Math.PI * 2,
            d = 35 + Math.random() * 25;
          s.style.setProperty("--dx", Math.cos(a) * d + "px");
          s.style.setProperty("--dy", Math.sin(a) * d + "px");
          s.style.left = "50%";
          s.style.top = "50%";
          el.appendChild(s);
          setTimeout(() => s.remove(), 950);
        }
      }

      function showWin() {
        document.getElementById("winStats").textContent =
          "You matched all " + PAIRS.length + " words in " + tries + " tries!";
        document.getElementById("overlay").classList.add("show");
        playWinFanfare();
      }

      function newGame() {
        matches = 0;
        tries = 0;
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        document.getElementById("overlay").classList.remove("show");
        render();
      }
      document.getElementById("resetBtn").addEventListener("click", newGame);
      document
        .getElementById("playAgainBtn")
        .addEventListener("click", newGame);
      document.getElementById("startBtn").addEventListener("click", () => {
        unlockAudio({ type: "click" });
        document.getElementById("startOverlay").classList.remove("show");
      });
      newGame();
    </script>
  </body>
</html>
